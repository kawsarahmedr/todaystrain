name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:30 Asia/Dhaka (UTC+6) = 18:30 UTC on the previous day.
    # The nightly rebuild refreshes date-dependent HTML ("today" lists, sitemap lastmod).
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Public values only (repository *variables*, not secrets).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_ADS_ENABLED: ${{ vars.NEXT_PUBLIC_ADS_ENABLED }}
      # Direct Upload: does not consume Cloudflare's Git-integration build quota.
      # Run from the repo root so ./functions (contact form API) is bundled too.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: pages deploy out --project-name=todaystrain --branch=main --commit-dirty=true
